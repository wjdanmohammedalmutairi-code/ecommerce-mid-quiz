<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>اختبار مبادئ التجارة الإلكترونية</title>
<style>
:root {
  --bg:#eef9f7; --card:#ffffff; --ink:#173b38; --muted:#678783;
  --accent:#167f78; --accent2:#46afa7; --soft:#dff3f0;
  --tag:#7ebdb7; --good:#18864b; --bad:#b8474e; --line:#d8efeb;
}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,Arial,sans-serif;background:linear-gradient(180deg,#eaf8f5,#f8fcfb);color:var(--ink);min-height:100vh}
.wrap{max-width:760px;margin:auto;padding:24px 16px 48px}
.brand{text-align:center;margin:12px 0 18px}
.brand h1{font-size:29px;margin:0 0 7px}
.brand p{margin:0;color:var(--muted);line-height:1.7}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:22px;box-shadow:0 12px 34px rgba(18,95,89,.09)}
.hidden{display:none!important}
.sizes{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-top:18px}
button{font:inherit;border:0;cursor:pointer}
.size-btn,.option-btn,.next-btn,.restart-btn{border-radius:14px;padding:14px 12px}
.size-btn{background:var(--soft);color:#146860;font-weight:800}
.topline{display:flex;justify-content:space-between;align-items:center;gap:12px;color:var(--muted);font-size:14px;margin-bottom:12px}
.progress{height:9px;background:#e1f1ee;border-radius:999px;overflow:hidden;margin-bottom:20px}
.bar{height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:.25s}
.qwrap{margin-bottom:18px}
.q{font-size:21px;line-height:1.65;font-weight:800;display:inline}
.agg{font-size:14px;font-weight:700;color:var(--tag);margin-right:8px;white-space:nowrap}
.options{display:grid;gap:11px}
.option-btn{text-align:right;background:#f7fcfb;border:1px solid #d8eeea;color:var(--ink);line-height:1.55}
.option-btn:disabled{cursor:default;opacity:1}
.option-btn.correct{background:#e8f7ee;border-color:#9bd4b2;color:#176d40}
.option-btn.wrong{background:#fff0f1;border-color:#e5a6ad;color:#913942}
.feedback{margin-top:18px;padding:15px;border-radius:14px;background:#f7fcfb;border:1px solid var(--line);line-height:1.7}
.feedback strong.good{color:var(--good)} .feedback strong.bad{color:var(--bad)}
.next-btn,.restart-btn{width:100%;margin-top:16px;background:var(--accent);color:white;font-weight:800}
.score{font-size:46px;font-weight:900;color:var(--accent);text-align:center;margin:14px 0 4px}
.center{text-align:center}
.small{font-size:13px;color:var(--muted);margin-top:12px;line-height:1.6}
@media(max-width:520px){.sizes{grid-template-columns:repeat(3,1fr)} .brand h1{font-size:25px} .q{font-size:19px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="brand">
    <h1>اختبار مبادئ التجارة الإلكترونية</h1>
    <p>الدروس 1-3 • صح/خطأ + اختيار من متعدد</p>
  </div>
  <section id="startCard" class="card">
    <h2 style="margin-top:0">كم سؤال تبين؟</h2>
    <div class="sizes">
      <button class="size-btn" onclick="startQuiz(20)">20</button>
      <button class="size-btn" onclick="startQuiz(40)">40</button>
      <button class="size-btn" onclick="startQuiz(60)">60</button>
      <button class="size-btn" onclick="startQuiz(80)">80</button>
      <button class="size-btn" onclick="startQuiz(100)">100</button>
    </div>
    <div class="small">الأسئلة موزعة على الدروس الثلاثة وتُخلط تلقائيًا. السؤال المأخوذ من اختبار 2023 يظهر بجانبه (من التجميعات).</div>
  </section>
  <section id="quizCard" class="card hidden">
    <div class="topline"><span id="counter"></span><span id="scoreNow"></span></div>
    <div class="progress"><div id="bar" class="bar"></div></div>
    <div class="qwrap"><span id="question" class="q"></span><span id="agg" class="agg hidden">(من التجميعات)</span></div>
    <div id="options" class="options"></div>
    <div id="feedback" class="feedback hidden"></div>
    <button id="nextBtn" class="next-btn hidden" onclick="nextQuestion()">السؤال التالي</button>
  </section>
  <section id="resultCard" class="card hidden center">
    <h2>خلص الاختبار 🎉</h2>
    <div id="finalScore" class="score"></div>
    <div id="finalPercent"></div>
    <button class="restart-btn" onclick="restart()">اختبار جديد</button>
  </section>
</div>

  fb.innerHTML=correct?`<strong class="good">صح ✅</strong><br><br>${q.explanation}`:`<strong class="bad">خطأ ❌</strong><br>الإجابة الصحيحة: <b>${q.options[q.answer]}</b><br><br>${q.explanation}`;
  fb.classList.remove("hidden");document.getElementById("scoreNow").textContent=`الدرجة: ${score}`;
  const nb=document.getElementById("nextBtn");nb.textContent=pos===quiz.length-1?"عرض النتيجة":"السؤال التالي";nb.classList.remove("hidden");
}
function nextQuestion(){pos++;if(pos>=quiz.length)return finish();render();window.scrollTo({top:0,behavior:"smooth"})}
function finish(){document.getElementById("quizCard").classList.add("hidden");document.getElementById("resultCard").classList.remove("hidden");const pct=Math.round(score/quiz.length*100);document.getElementById("finalScore").textContent=`${score} / ${quiz.length}`;document.getElementById("finalPercent").textContent=`${pct}%`;window.scrollTo({top:0,behavior:"smooth"})}
function restart(){document.getElementById("resultCard").classList.add("hidden");document.getElementById("startCard").classList.remove("hidden")}
</script>
</body>
</html>
